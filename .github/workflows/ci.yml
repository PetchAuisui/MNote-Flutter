name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: Format & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Check for outdated dependencies (informational)
        run: flutter pub outdated || true

  test:
    name: Unit, Widget & Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Coverage summary
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          # Generated code (drift, l10n, FlutterFire) is not ours to test.
          lcov --remove coverage/lcov.info \
            '*.g.dart' '*/l10n/*' '*/firebase_options.dart' \
            -o coverage/lcov.info --ignore-errors unused
          lcov --summary coverage/lcov.info | tee coverage/summary.txt
          {
            echo '### Test coverage'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage ≥ 70%
        env:
          MIN_COVERAGE: 70
        run: |
          pct=$(grep -oP 'lines\.*:\s*\K[0-9.]+' coverage/summary.txt)
          echo "Line coverage: ${pct}% (minimum ${MIN_COVERAGE}%)"
          if awk -v p="$pct" -v m="$MIN_COVERAGE" 'BEGIN { exit !(p < m) }'; then
            echo "::error::Line coverage ${pct}% is below ${MIN_COVERAGE}%"
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The whole app runs headless on the Flutter test device, with real
      # files on disk and the real SQLite library index.
      - name: Run integration tests
        run: flutter test integration_test -d flutter-tester --reporter expanded

  security-rules:
    name: Security Tests (Firebase rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test_security_rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test_security_rules/package-lock.json

      # The Firebase emulators need Java 21 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('test_security_rules/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore and Storage rules tests
        run: npm test

  build-android:
    name: Build Android (debug APK)
    needs: [analyze, test, integration, security-rules]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios:
    name: Build iOS (no codesign)
    needs: [analyze, test, integration, security-rules]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
